; Cyberdeck ESP32-S3 N16R8 - Chat 0, buoc 2: LVGL + input qua serial
;
; Ghim phien ban: TFT_eSPI loi tft.init() tren ESP32-S3 voi Arduino core moi
; (Bodmer/TFT_eSPI #3346). espressif32@6.5.0 dung Arduino core 2.0.14.
; Khong nang cap platform/TFT_eSPI khi chua test lai tft.init().
;
; Luu y: PlatformIO khong ho tro comment cung dong voi gia tri,
; nen moi comment deu dat o dong rieng.

[platformio]
default_envs = cyberdeck_st7789

; ---- Cau hinh chung cho moi env ----
[env]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DUSER_SETUP_LOADED=1
  -DTFT_MOSI=11
  -DTFT_SCLK=12
  -DTFT_CS=10
  -DTFT_DC=9
  -DTFT_RST=8
  -DTFT_MISO=-1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DSMOOTH_FONT=0
  -DLV_CONF_INCLUDE_SIMPLE
  -DLV_LVGL_H_INCLUDE_SIMPLE
  -Isrc
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  lvgl/lvgl@8.3.11
  bodmer/TJpg_Decoder@1.1.0

; ---- Phan chung cua man ST7735S 1.8" (160x128 khi xoay ngang) ----
; Day chi la mot section de dung lai, khong phai env.
[tft_st7735]
build_flags =
  -DST7735_DRIVER
  -DTFT_WIDTH=128
  -DTFT_HEIGHT=160
  -DSPI_FREQUENCY=27000000
  -DSCREEN_W=160
  -DSCREEN_H=128

; ---- Man ST7789 2.8" ----
; TFT_RGB_ORDER=TFT_BGR: module nay bi doi cho do va xanh duong.
; Dao mau duoc sua trong lvgl_port.cpp bang tft.invertDisplay(false).
[tft_st7789]
build_flags =
  -DST7789_DRIVER
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DSPI_FREQUENCY=40000000
  -DSCREEN_W=320
  -DSCREEN_H=240

; ---- Env mac dinh: thu BLACKTAB truoc ----
[env:cyberdeck_st7735]
build_flags =
  ${env.build_flags}
  ${tft_st7735.build_flags}
  -DST7735_BLACKTAB

; ---- Cac env de thu tab mau khac neu hinh bi lech/sai mau ----
; Chay: pio run -e tab_red -t upload
[env:tab_red]
build_flags =
  ${env.build_flags}
  ${tft_st7735.build_flags}
  -DST7735_REDTAB

[env:tab_green]
build_flags =
  ${env.build_flags}
  ${tft_st7735.build_flags}
  -DST7735_GREENTAB

[env:tab_green2]
build_flags =
  ${env.build_flags}
  ${tft_st7735.build_flags}
  -DST7735_GREENTAB2

[env:tab_green3]
build_flags =
  ${env.build_flags}
  ${tft_st7735.build_flags}
  -DST7735_GREENTAB3

; ---- Man ST7789 2.8" ----
; -DTFT_INVERSION_ON: sua loi mau bi dao (nen den hien thanh trang).
; Neu do va xanh duong bi doi cho, them dong -DTFT_RGB_ORDER=TFT_BGR o cuoi.
[env:cyberdeck_st7789]
build_flags =
  ${env.build_flags}
  ${tft_st7789.build_flags}
  -DTFT_RGB_ORDER=TFT_BGR

  ; Sketch test the SD, khong dung TFT/LVGL
[env:sd_test]
build_src_filter =
  -<*>
  +<../tools/sd_test/sd_test.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Isrc

[env:rtc_test]
build_src_filter =
  -<*>
  +<../tools/rtc_test/rtc_test.cpp>
  +<services/time_service.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Isrc

[env:i2s_test]
build_src_filter =
  -<*>
  +<../tools/i2s_test/i2s_test.cpp>
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Isrc

; Env kiểm thử rò rỉ bộ nhớ: chạy toàn bộ firmware trừ main.cpp, dùng tools/leak_test thay thế.
[env:leak_test]
build_src_filter =
  +<*>
  -<main.cpp>
  +<../tools/leak_test/leak_test.cpp>
build_flags =
  ${env.build_flags}
  ${tft_st7789.build_flags}
  -DTFT_RGB_ORDER=TFT_BGR
  -DLEAK_TEST=1
  -DLEAK_ONLY_PHASE7=1

; Env kiểm thử hiệu năng: chạy toàn bộ firmware trừ main.cpp, dùng tools/perf_test thay thế.
[env:perf_test]
build_src_filter =
  +<*>
  -<main.cpp>
  +<../tools/perf_test/perf_test.cpp>
build_flags =
  ${env.build_flags}
  ${tft_st7789.build_flags}
  -DTFT_RGB_ORDER=TFT_BGR
  -DPERF_TEST=1
  -DPERF_NO_TASKSTATE=1
