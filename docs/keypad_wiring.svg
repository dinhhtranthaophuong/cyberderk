<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="900" height="660" fill="#fff"/>
<text x="450" y="34" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">Sơ đồ nối bàn phím 3x3 với ESP32-S3</text>
