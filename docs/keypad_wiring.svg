<text x="135" y="122" font-size="11" text-anchor="middle" fill="#556">DevKitC-1 N16R8</text>
<line x1="230" y1="190" x2="440" y2="190" stroke="#d9700f" stroke-width="3"/>
<line x1="440" y1="190" x2="440" y2="458" stroke="#d9700f" stroke-width="3"/>
