<text x="440" y="182" font-size="12" font-weight="bold" text-anchor="middle" fill="#d9700f">C1</text>
<line x1="230" y1="165" x2="580" y2="165" stroke="#d9700f" stroke-width="3"/>
<line x1="580" y1="165" x2="580" y2="458" stroke="#d9700f" stroke-width="3"/>
<circle cx="230" cy="165" r="5" fill="#d9700f"/>
<text x="222" y="169" font-size="12" text-anchor="end" fill="#222">GPIO 42</text>
<text x="580" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#d9700f">C2</text>
<line x1="230" y1="140" x2="720" y2="140" stroke="#d9700f" stroke-width="3"/>
<line x1="720" y1="140" x2="720" y2="458" stroke="#d9700f" stroke-width="3"/>
<circle cx="230" cy="140" r="5" fill="#d9700f"/>
<text x="222" y="144" font-size="12" text-anchor="end" fill="#222">GPIO 21</text>
<text x="720" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#d9700f">C3</text>
<line x1="230" y1="230" x2="770" y2="230" stroke="#1d6fd6" stroke-width="3"/>
<circle cx="230" cy="230" r="5" fill="#1d6fd6"/>
<text x="222" y="234" font-size="12" text-anchor="end" fill="#222">GPIO 38</text>
<text x="262" y="222" font-size="12" font-weight="bold" fill="#1d6fd6">R1</text>
<line x1="230" y1="330" x2="770" y2="330" stroke="#1d6fd6" stroke-width="3"/>
<circle cx="230" cy="330" r="5" fill="#1d6fd6"/>
<text x="222" y="334" font-size="12" text-anchor="end" fill="#222">GPIO 39</text>
<text x="262" y="322" font-size="12" font-weight="bold" fill="#1d6fd6">R2</text>
<line x1="230" y1="430" x2="770" y2="430" stroke="#1d6fd6" stroke-width="3"/>
<circle cx="230" cy="430" r="5" fill="#1d6fd6"/>
<text x="222" y="434" font-size="12" text-anchor="end" fill="#222">GPIO 40</text>
<text x="262" y="422" font-size="12" font-weight="bold" fill="#1d6fd6">R3</text>
<rect x="388" y="200" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="388" cy="230" r="5" fill="#1d6fd6"/>
<circle cx="440" cy="200" r="5" fill="#d9700f"/>
<text x="440" y="234" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">1</text>
<text x="440" y="252" font-size="10" text-anchor="middle" fill="#444">BACK / HOME (giữ)</text>
<rect x="528" y="200" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="528" cy="230" r="5" fill="#1d6fd6"/>
<circle cx="580" cy="200" r="5" fill="#d9700f"/>
<text x="580" y="234" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">2</text>
<text x="580" y="252" font-size="12" text-anchor="middle" fill="#444">UP</text>
<rect x="668" y="200" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="668" cy="230" r="5" fill="#1d6fd6"/>
<circle cx="720" cy="200" r="5" fill="#d9700f"/>
<text x="720" y="234" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">3</text>
<text x="720" y="252" font-size="12" text-anchor="middle" fill="#444">OPTION</text>
<rect x="388" y="300" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="388" cy="330" r="5" fill="#1d6fd6"/>
<circle cx="440" cy="300" r="5" fill="#d9700f"/>
<text x="440" y="334" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">4</text>
<text x="440" y="352" font-size="12" text-anchor="middle" fill="#444">LEFT</text>
<rect x="528" y="300" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="528" cy="330" r="5" fill="#1d6fd6"/>
<circle cx="580" cy="300" r="5" fill="#d9700f"/>
<text x="580" y="334" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">5</text>
<text x="580" y="352" font-size="12" text-anchor="middle" fill="#444">ENTER</text>
<rect x="668" y="300" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="668" cy="330" r="5" fill="#1d6fd6"/>
<circle cx="720" cy="300" r="5" fill="#d9700f"/>
<text x="720" y="334" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">6</text>
<text x="720" y="352" font-size="12" text-anchor="middle" fill="#444">RIGHT</text>
<rect x="388" y="400" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="388" cy="430" r="5" fill="#1d6fd6"/>
<circle cx="440" cy="400" r="5" fill="#d9700f"/>
<text x="440" y="434" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">7</text>
<text x="440" y="452" font-size="12" text-anchor="middle" fill="#444">PREV</text>
<rect x="528" y="400" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="528" cy="430" r="5" fill="#1d6fd6"/>
<circle cx="580" cy="400" r="5" fill="#d9700f"/>
<text x="580" y="434" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">8</text>
<text x="580" y="452" font-size="12" text-anchor="middle" fill="#444">DOWN</text>
<rect x="668" y="400" width="104" height="60" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
<circle cx="668" cy="430" r="5" fill="#1d6fd6"/>
<circle cx="720" cy="400" r="5" fill="#d9700f"/>
<text x="720" y="434" font-size="20" font-weight="bold" text-anchor="middle" fill="#222">9</text>
<text x="720" y="452" font-size="12" text-anchor="middle" fill="#444">NEXT</text>

<text x="40" y="530" font-size="12" fill="#333">• Dây hàng (xanh) và dây cột (cam) chạy xuyên qua các ô. Mỗi nút chỉ nối chấm xanh với chấm cam của nó, không cần GND, 3V3.</text>
<text x="40" y="551" font-size="12" fill="#333">• Không cần điện trở ngoài: cột dùng điện trở kéo lên bên trong (INPUT_PULLUP). Không cần diode.</text>
<text x="40" y="572" font-size="12" fill="#333">• Nút bấm 4 chân (6x6 mm): 2 chân cùng cạnh đã nối sẵn với nhau, hãy dùng 2 chân CHÉO nhau.</text>
<text x="40" y="593" font-size="12" fill="#333">• 6 chân GPIO 38-42 và 21 không trùng TFT (7-12), SD (15-18), I2S (4-6), I2C (1-2) và không nằm trong nhóm chân cấm.</text>
<text x="40" y="614" font-size="12" fill="#333">• Nhấn từ 2 nút trở lên cùng lúc sẽ bị bỏ qua. Phím 1: nhấn nhanh = ESC, giữ 0,8 s = HOME.</text>
</svg>